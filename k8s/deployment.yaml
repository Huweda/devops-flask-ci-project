apiVersion: apps/v1
kind: Deployment

metadata:
  name: flask-app-deployment
  labels:
    app: flask-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: flask-app

  template:
    metadata:
      labels:
        app: flask-app

    spec:
      containers:
        - name: flask-container
          image: huweda/devops-flask-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: APP_MESSAGE
              value: "Hello from Kubernetes!"